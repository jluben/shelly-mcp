[project]
name = "shelly-mcp"
version = "0.3.1"
description = "MCP server for local Shelly Gen2+ devices (JSON-RPC over HTTP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
shelly-mcp = "shelly_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelly_mcp"]
